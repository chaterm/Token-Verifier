# golangci-lint 配置。v2 schema，完整参考 https://golangci-lint.run/usage/configuration/

version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        # 输出到 stdout/stderr 的渲染函数：写失败（磁盘满/管道断）无处理价值，
        # 且 CLI 各处统一风格。测试文件整体豁免 errcheck（见 exclusions）。
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
  exclusions:
    rules:
      # 测试代码里 ResponseWriter / os.Setenv / json.Unmarshal 的返回值
      # 断言失败即可读出问题，逐个检查徒增噪声
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
